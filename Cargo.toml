[package]
name = "rili"
version = "0.2.0"
edition = "2021"
description = "本地优先的桌面日历 / 待办 / 便签工具，使用 Rust + Slint 构建"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rili"
path = "src/main.rs"
test = false
bench = false

[dependencies]
slint = { version = "1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "unstable-winit-030", "unstable-fontique-010", "renderer-software", "renderer-femtovg", "accessibility"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4"
chinese-lunisolar-calendar = "0.2"
lunar_rust = "1.0.1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
directories = "6"
anyhow = "1"
tray-icon = "0.24"
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
base64 = "0.22"
quick-xml = "0.39"
url = "2"

[target.'cfg(windows)'.dependencies]
winrt-toast = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[build-dependencies]
slint-build = "1.17.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
# 日常本地 Release 优先保证构建速度。这个 GUI 的主要开销在 Slint 生成代码，
# opt-level=1 已消除调试构建的主要运行时开销；更激进的优化留给按需分发构建。
opt-level = 1
lto = false
codegen-units = 256
incremental = true
strip = true
panic = "abort"

[profile.release.build-override]
# 构建脚本和过程宏只在编译期运行，无需按 Release 级别优化。
opt-level = 0
codegen-units = 256

[profile.dev]
debug = 0

[profile.test]
debug = 0
