name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets -j 1
      - name: Clippy
        run: cargo clippy --all-targets -j 1 -- -D warnings
      - name: Core tests
        run: cargo test --all-targets -j 1

  visual-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Slint viewer
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/slint-viewer.exe
          key: slint-viewer-1.18.0-windows
      - name: Install matching Slint viewer
        shell: pwsh
        run: |
          if (-not (Get-Command slint-viewer -ErrorAction SilentlyContinue) -or (slint-viewer --version) -ne 'slint-viewer 1.18.0') {
            cargo install slint-viewer --version 1.18.0 --locked --force
          }
      - name: Compare 100–200% DPI screenshots
        shell: pwsh
        run: ./scripts/visual-regression.ps1
      - name: Upload visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diagnostics
          path: target/visual-regression/current

  windows-native-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native smoke executable
        run: cargo build -j 1
      - name: Exercise native windows and event handlers
        shell: pwsh
        # Hosted Windows runners have no usable OpenGL driver. Exercise real
        # Win32 windows with the application's compiled-in software renderer.
        env:
          SLINT_BACKEND: winit-software
        run: ./scripts/windows-native-smoke.ps1
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-diagnostics
          path: target/native-smoke-data-*/timehub.log
